<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-labelledby="title desc">
<title id="title">Skill movement</title><desc id="desc">Project Skills and Global Skills exchange skills with Move. Global Skills and Repo Skills exchange skills with Push and Pull.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#cccccc;text-anchor:middle}rect{fill:#1f2020;stroke:#cccccc;stroke-width:1.5}.edge{fill:none;stroke:#cccccc;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.optional{font-size:13px;fill:#cccccc}.background{fill:#333333;stroke:none}</style>
<rect width="800" height="150" class="background"/>
<path class="edge both" d="M 212 89 H 300"/><path class="edge both" d="M 500 89 H 588"/><text x="256" y="60">Move</text><text x="544" y="60">Push / Pull</text><rect x="22" y="61" width="190" height="56" rx="10"/><text x="117.0" y="95">Project Skills</text><rect x="300" y="61" width="200" height="56" rx="10"/><text x="400.0" y="95">Global Skills</text><rect x="588" y="61" width="190" height="56" rx="10"/><text x="683.0" y="95">Repo Skills</text></svg>
