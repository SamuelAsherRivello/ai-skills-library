<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" role="img" aria-labelledby="title desc">
<title id="title">Neutral palette: A to B to C</title>
<desc id="desc">The same three-node flowchart in the Neutral palette.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker></defs>
<rect width="800" height="140" fill="#ffffff"/>
<g fill="none" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"><path d="M 200 70 H 325"/><path d="M 475 70 H 600"/></g>
<g fill="#eeeeee" stroke="#999999" stroke-width="1.5"><rect x="50" y="40" width="150" height="60"/><rect x="325" y="40" width="150" height="60"/><rect x="600" y="40" width="150" height="60"/></g>
<g fill="#333333" font-family="Trebuchet MS,Verdana,Arial,sans-serif" font-size="20" text-anchor="middle"><text x="125" y="77">A</text><text x="400" y="77">B</text><text x="675" y="77">C</text></g>
</svg>
